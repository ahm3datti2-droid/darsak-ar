<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تشخيص درسك AR (مؤقت)</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>body{font-family:sans-serif;padding:16px}pre{background:#f3f4f6;padding:12px;white-space:pre-wrap}button{padding:10px 16px;margin:6px 0;font-size:16px}</style>
</head>
<body>
<h1>تشخيص درسك AR (صفحة مؤقتة للحذف بعد التشخيص)</h1>
<h2>أ) تحويل اللوحات النصية إلى GLB</h2>
<button id="runPanels" type="button">تشغيل اختبار اللوحات</button>
<pre id="panelOut">لم يُشغَّل بعد</pre>
<h2>ب) التفكيك (الروبوت — متعدد القطع)</h2>
<model-viewer id="mv" src="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb" camera-controls auto-rotate style="width:100%;height:320px"></model-viewer>
<button id="runExplode" type="button">تشغيل اختبار التفكيك</button>
<pre id="explodeOut">لم يُشغَّل بعد</pre>
<script type="module">
import { textPanelToGlb } from './lib/image-to-glb.js';
const out = (id, s) => { document.getElementById(id).textContent = s; };
window.addEventListener('error', (e) => { out('explodeOut', 'PAGE ERROR: ' + (e.message || e.error)); });
document.getElementById('runPanels').onclick = async () => {
  const texts = ['1- البيضة 🥚', '2- اليرقة 🐛', '3- الشرنقة', '4- الفراشة 🦋', 'المجموعة الشمسية ☀️'];
  let log = '';
  for (const t of texts) {
    try {
      const r = await textPanelToGlb(t, { bg: '#4F46E5' });
      log += `PASS: ${t} -> glb ${r.blob.size} bytes, aspect ${r.aspect}\n`;
    } catch (e) {
      log += `FAIL: ${t} -> ${e.message}\n`;
    }
  }
  out('panelOut', log);
};
document.getElementById('runExplode').onclick = async () => {
  const logEl = document.getElementById('explodeOut');
  const log = (s) => { logEl.textContent += s + '\n'; };
  try {
    logEl.textContent = 'RUNNING... (الزر يعمل — جارٍ فحص النموذج)\n';
    const mv = document.getElementById('mv');
    log(`mv exists: ${!!mv}`);
    log(`mv.model: ${mv.model ? mv.model.constructor.name : String(mv.model)}`);
    log(`cameraOrbit before: ${mv.cameraOrbit}`);
    let meshes = [];
    if (mv.model) {
      for (const sym of Object.getOwnPropertySymbols(mv.model)) {
        const v = mv.model[sym];
        if (Array.isArray(v) && v.length && v[0] && v[0].mesh && v[0].mesh.isMesh) {
          meshes = v.map((n) => n.mesh).filter((m) => m && m.isMesh);
          log(`found meshes via symbol: ${sym.toString()} -> ${meshes.length} meshes`);
          break;
        }
      }
    }
    if (!meshes.length) { log('NO MESHES FOUND — cannot explode'); return; }
    const THREE = await import('three');
    const V3 = THREE.Vector3;
    let root = meshes[0];
    while (root.parent && root.parent.isObject3D && root.parent.type !== 'Scene') root = root.parent;
    root.updateWorldMatrix(true, true);
    const orig = meshes.map((o) => o.position.clone());
    const explode = (factor) => {
      const center = new V3();
      let n = 0;
      meshes.forEach((o) => {
        if (!o.geometry) return;
        o.geometry.computeBoundingBox();
        const c = o.geometry.boundingBox.getCenter(new V3());
        c.applyMatrix4(o.matrixWorld);
        center.add(c); n++;
      });
      center.divideScalar(n);
      meshes.forEach((o) => {
        if (!o.userData.darsakOrig) o.userData.darsakOrig = o.position.clone();
        o.geometry.computeBoundingBox();
        const c = o.geometry.boundingBox.getCenter(new V3());
        c.applyMatrix4(o.matrixWorld);
        const dirW = c.sub(center);
        if (dirW.lengthSq() < 1e-6) dirW.set(0, 1, 0);
        dirW.normalize();
        const parent = o.parent || root;
        const dirL = dirW.clone().transformDirection(parent.matrixWorld.clone().invert());
        o.position.copy(o.userData.darsakOrig).addScaledVector(dirL, factor);
      });
    };
    // تفكيك + إبعاد الكاميرا (نفس منطق التطبيق)
    explode(0.5);
    const beforeOrbit = mv.cameraOrbit || '';
    try {
      const parts = (beforeOrbit || '0deg 75deg 100%').split(' ');
      if (parts.length >= 3) parts[2] = '230%';
      mv.cameraOrbit = parts.join(' ');
      log(`cameraOrbit after explode: ${mv.cameraOrbit}`);
    } catch (e) { log(`SETTING cameraOrbit THREW: ${e.message}`); }
    log(`first mesh pos after explode: ${meshes[0].position.toArray().map((v) => v.toFixed(3)).join(', ')}`);
    // إعادة التركيب + إرجاع الكاميرا
    explode(0);
    try { mv.cameraOrbit = beforeOrbit; log(`cameraOrbit after reassemble: ${mv.cameraOrbit}`); }
    catch (e) { log(`RESTORING cameraOrbit THREW: ${e.message}`); }
    let restored = true;
    meshes.forEach((o, i) => { if (o.position.distanceTo(orig[i]) > 0.001) restored = false; });
    log(`first mesh pos after reassemble: ${meshes[0].position.toArray().map((v) => v.toFixed(3)).join(', ')}`);
    log(`positions restored: ${restored}`);
    log(restored ? 'EXPLODE PASS: meshes moved and restored' : 'EXPLODE FAIL: positions did not restore');
  } catch (e) {
    log(`EXPLODE THREW: ${e.message}`);
  }
};
</script>
</body>
</html>
